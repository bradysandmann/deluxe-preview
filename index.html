<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Deluxe | Feel Deluxe. Live Deluxe.</title>
<meta name="description" content="Deluxe is an electrolyte drink mix with energy and vitamins in single-serve stick packs. Launching soon. Join the list for early access.">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="assets/img/favicon-64.png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
<link rel="stylesheet" href="assets/css/showroom.css">
</head>
<body data-page="gate">
<div data-include="header"></div>

<main id="main">

  <!-- Hero: silent looping real-footage film with the holographic mark over it -->
  <section class="hero" data-hero aria-label="Deluxe">
    <video class="hero__video" autoplay muted loop playsinline preload="auto" poster="assets/img/hero-film.jpg" aria-hidden="true" tabindex="-1">
      <source src="assets/video/hero-film-v.mp4" type="video/mp4" media="(max-aspect-ratio: 4/5)">
      <source src="assets/video/hero-film.mp4" type="video/mp4">
    </video>
    <div class="hero__shade"></div>
    <div class="holo" aria-hidden="true">
      <div class="holo__mark">
        <img class="holo__ghost" src="assets/img/logo-lockup-alpha.png" alt="" width="1167" height="842">
        <img class="holo__logo" src="assets/img/logo-lockup-alpha.png" alt="" width="1167" height="842">
        <div class="holo__sweep"></div>
        <div class="holo__scan"></div>
      </div>
    </div>
    <div class="wrap hero__foot">
      <div class="hero__pitch">
        <h1 class="visually-hidden">Deluxe. Feel Deluxe. Live Deluxe.</h1>
        <div class="waitlist" id="early-access">
          <!-- No launch date yet (Brady 2026-11-19): the countdown is shown "under repair" instead of ticking to a made-up date -->
          <div class="countdown countdown--repair">
            <p class="countdown__label">Season 01</p>
            <svg class="repair" viewBox="0 0 450 150" role="img" aria-label="A broken countdown clock being repaired by a tiny crew">
              <g class="repair__clock"><rect class="seg " x="24" y="4" width="28" height="6"/><rect class="seg " x="52" y="10" width="6" height="26"/><rect class="seg " x="52" y="42" width="6" height="26"/><rect class="seg " x="24" y="68" width="28" height="6"/><rect class="seg " x="18" y="42" width="6" height="26"/><rect class="seg " x="18" y="10" width="6" height="26"/><rect class="seg on" x="24" y="36" width="28" height="6"/><rect class="seg " x="70" y="4" width="28" height="6"/><rect class="seg " x="98" y="10" width="6" height="26"/><rect class="seg " x="98" y="42" width="6" height="26"/><rect class="seg " x="70" y="68" width="28" height="6"/><rect class="seg " x="64" y="42" width="6" height="26"/><rect class="seg " x="64" y="10" width="6" height="26"/><rect class="seg on" x="70" y="36" width="28" height="6"/><rect class="seg " x="134" y="4" width="28" height="6"/><rect class="seg " x="162" y="10" width="6" height="26"/><rect class="seg " x="162" y="42" width="6" height="26"/><rect class="seg " x="134" y="68" width="28" height="6"/><rect class="seg " x="128" y="42" width="6" height="26"/><rect class="seg on" x="134" y="36" width="28" height="6"/><rect class="seg " x="180" y="4" width="28" height="6"/><rect class="seg " x="208" y="10" width="6" height="26"/><rect class="seg " x="208" y="42" width="6" height="26"/><rect class="seg " x="180" y="68" width="28" height="6"/><rect class="seg " x="174" y="42" width="6" height="26"/><rect class="seg " x="174" y="10" width="6" height="26"/><rect class="seg on" x="180" y="36" width="28" height="6"/><rect class="seg " x="244" y="4" width="28" height="6"/><rect class="seg " x="244" y="68" width="28" height="6"/><rect class="seg " x="238" y="42" width="6" height="26"/><rect class="seg " x="238" y="10" width="6" height="26"/><rect class="seg on" x="244" y="36" width="28" height="6"/><rect class="seg " x="290" y="4" width="28" height="6"/><rect class="seg " x="318" y="10" width="6" height="26"/><rect class="seg " x="318" y="42" width="6" height="26"/><rect class="seg " x="290" y="68" width="28" height="6"/><rect class="seg " x="284" y="42" width="6" height="26"/><rect class="seg " x="284" y="10" width="6" height="26"/><rect class="seg on" x="290" y="36" width="28" height="6"/><rect class="seg " x="354" y="4" width="28" height="6"/><rect class="seg " x="382" y="10" width="6" height="26"/><rect class="seg " x="382" y="42" width="6" height="26"/><rect class="seg " x="354" y="68" width="28" height="6"/><rect class="seg " x="348" y="42" width="6" height="26"/><rect class="seg " x="348" y="10" width="6" height="26"/><rect class="seg on" x="354" y="36" width="28" height="6"/><rect class="seg " x="400" y="4" width="28" height="6"/><rect class="seg " x="428" y="10" width="6" height="26"/><rect class="seg " x="428" y="42" width="6" height="26"/><rect class="seg " x="400" y="68" width="28" height="6"/><rect class="seg " x="394" y="10" width="6" height="26"/><rect class="seg on" x="400" y="36" width="28" height="6"/><rect class="seg on" x="112" y="26" width="5" height="5"/><rect class="seg on" x="112" y="46" width="5" height="5"/><rect class="seg on" x="222" y="26" width="5" height="5"/><rect class="seg on" x="222" y="46" width="5" height="5"/><rect class="seg on" x="332" y="26" width="5" height="5"/><rect class="seg on" x="332" y="46" width="5" height="5"/></g>
              <g class="repair__dangle"><rect class="seg on" x="0" y="0" width="6" height="26" transform="translate(272 12)"/></g>
              <g class="repair__sparks" transform="translate(150 40)"><path d="M0 0l-8 -6M0 0l-9 3M0 0l-4 -10M0 0l2 -9"/></g>
              <g class="repair__ladder"><path d="M216 150 L236 82 M232 150 L252 82 M220 136h16 M224 122h16 M228 108h16 M232 94h16"/></g>
              <g class="repair__worker repair__worker--up" transform="translate(240 70)">
                <circle cx="0" cy="-14" r="5"/><path class="hat" d="M-7 -16 a7 6 0 0 1 14 0 z"/>
                <path d="M0 -9 V8 M0 8 L-5 20 M0 8 L4 20 M0 -4 L-8 2"/><path class="repair__arm" d="M0 -4 L9 -14"/>
              </g>
              <g class="repair__worker repair__worker--walk" transform="translate(70 128)">
                <circle cx="0" cy="-14" r="5"/><path class="hat" d="M-7 -16 a7 6 0 0 1 14 0 z"/>
                <path d="M0 -9 V8 M0 8 L-5 20 M0 8 L5 20 M0 -4 L9 -2 M0 -4 L-6 4"/><rect class="seg on" x="9" y="-6" width="26" height="5" transform="rotate(-8 9 -6)"/>
              </g>
              <path class="repair__ground" d="M0 149 H450"/>
            </svg>
            <p class="repair__note"><strong>Countdown under repair.</strong> The crew is dialing in the drop date. Join the waitlist and you hear it first.</p>
          </div>
          <!-- Real sign-up: posts to the live Shopify store's own newsletter form (deluxe-hq.com), tagged waitlist, into a hidden frame so the visitor stays here -->
          <iframe name="waitlist-sink" title="Waitlist" hidden></iframe>
          <form class="waitlist__form" data-form="waitlist" method="post" action="https://deluxe-hq.com/contact#contact_form" target="waitlist-sink" accept-charset="UTF-8" novalidate>
            <input type="hidden" name="form_type" value="customer">
            <input type="hidden" name="utf8" value="✓">
            <input type="hidden" name="contact[tags]" value="newsletter,waitlist,season-01">
            <label class="visually-hidden" for="waitlist-email">Email address</label>
            <input id="waitlist-email" type="email" name="contact[email]" placeholder="Email address" autocomplete="email" required>
            <button type="submit">Join the waitlist</button>
            <p class="form-status" data-status role="status" aria-live="polite"></p>
          </form>
        </div>
      </div>
    </div>
  </section>
</main>


<script src="assets/js/site.js"></script>
</body>
</html>
