<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Deluxe | Feel Deluxe. Live Deluxe.</title>
<meta name="description" content="Deluxe is an electrolyte drink mix with energy and vitamins in single-serve stick packs. Launching soon. Join the list for early access.">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="assets/img/favicon-64.png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
<link rel="stylesheet" href="assets/css/showroom.css">
<link rel="stylesheet" href="assets/css/countdown.css">
</head>
<body data-page="gate">
<div data-include="header"></div>

<main id="main">

  <!-- Hero: silent looping real-footage film with the holographic mark over it -->
  <section class="hero" data-hero aria-label="Deluxe">
    <video class="hero__video" autoplay muted loop playsinline preload="auto" poster="assets/img/hero-film.jpg" aria-hidden="true" tabindex="-1">
      <source src="assets/video/hero-film-v.mp4" type="video/mp4" media="(max-aspect-ratio: 4/5)">
      <source src="assets/video/hero-film.mp4" type="video/mp4">
    </video>
    <div class="hero__shade"></div>
    <div class="holo" aria-hidden="true">
      <div class="holo__mark">
        <img class="holo__ghost" src="assets/img/logo-lockup-alpha.png" alt="" width="1167" height="842">
        <img class="holo__logo" src="assets/img/logo-lockup-alpha.png" alt="" width="1167" height="842">
        <div class="holo__sweep"></div>
        <div class="holo__scan"></div>
      </div>
    </div>
    <div class="wrap hero__foot">
      <div class="hero__pitch">
        <h1 class="visually-hidden">Deluxe. Feel Deluxe. Live Deluxe.</h1>
        <div class="waitlist" id="early-access">
          <!-- No launch date yet (Brady 2026-11-19): the countdown stays frozen instead of ticking to a made-up date; the "under repair" note was removed on his word -->
          <div class="countdown countdown--repair">
            <p class="countdown__label">Season 01</p>
            <!-- Countdown (Brady 2026-11-20): chrome seven-segment digits on one line, all zeros while there is no launch date; random flicker flips a digit to a random number for a split second. Add data-target="<ISO date>" to .nuke and the same component ticks. -->
            <div class="nuke" aria-hidden="true">
              <svg class="nuke__defs" aria-hidden="true" focusable="false"><defs><linearGradient id="nuke-chrome" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="20.4"><stop offset="0" stop-color="#eef1f4"/><stop offset=".36" stop-color="#c7ccd2"/><stop offset=".49" stop-color="#7d828a"/><stop offset=".55" stop-color="#a7acb4"/><stop offset=".8" stop-color="#e4e7eb"/><stop offset="1" stop-color="#aeb3ba"/></linearGradient></defs></svg>
              <p class="countdown__digits countdown__digits--broken nuke__stack"><span class="nuke__row" data-l="Days"><span><b>0</b><b>0</b></span></span><i class="nuke__sep"></i><span class="nuke__row" data-l="Hrs"><span><b>0</b><b>0</b></span></span><i class="nuke__sep"></i><span class="nuke__row" data-l="Min"><span><b>0</b><b>0</b></span></span><i class="nuke__sep"></i><span class="nuke__row" data-l="Sec"><span><b>0</b><b>0</b></span></span></p>
            </div>
            <script>
              (() => {   // all-zero chrome readout; random flickers flip digits for a split second; ticks only once a launch date is set
                const root = document.querySelector('.nuke'); if (!root) return;
                const rows = [...root.querySelectorAll('.nuke__row')];
                // seven-segment glyphs: every segment drawn, lit ones get .on (unlit stay faintly visible)
                const SEG = { a: 'M2.2 1.2 3.2 .2h5.6l1 1-1 1H3.2z', b: 'M10.8 2.2l1 1v5.6l-1 1-1-1V3.2z', c: 'M10.8 10.4l1 1v5.6l-1 1-1-1v-5.6z',
                  d: 'M2.2 19.2l1-1h5.6l1 1-1 1H3.2z', e: 'M1.2 10.4l1 1v5.6l-1 1-1-1v-5.6z', f: 'M1.2 2.2l1 1v5.6l-1 1-1-1V3.2z', g: 'M2.2 10.2l1-1h5.6l1 1-1 1H3.2z' };
                const LIT = ['abcdef', 'bc', 'abged', 'abgcd', 'fgbc', 'afgcd', 'afgedc', 'abc', 'abcdefg', 'abcdfg'];
                // the DELUXE logo's shine: a light band sweeps across the digits every 6 s, one gradient per digit so it travels left to right
                const defs = root.querySelector('.nuke__defs defs');
                for (let i = 0; i < 8; i++) {
                  const at = (1.2 + i * .07).toFixed(2) + 's';
                  defs.insertAdjacentHTML('beforeend', '<linearGradient id="nuke-shine-' + i + '" gradientUnits="userSpaceOnUse" x1="-30" y1="0" x2="-16" y2="20.4">' +
                    '<stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>' +
                    '<animate attributeName="x1" values="-30;30;30" keyTimes="0;.16;1" dur="6s" begin="' + at + '" repeatCount="indefinite"/>' +
                    '<animate attributeName="x2" values="-16;44;44" keyTimes="0;.16;1" dur="6s" begin="' + at + '" repeatCount="indefinite"/></linearGradient>');
                }
                const glyph = (n, i) => '<svg viewBox="0 0 12 20.4" aria-hidden="true"><g transform="skewX(-6) translate(1 0)">' +
                  Object.keys(SEG).map((s) => '<path class="seg' + (LIT[n].includes(s) ? ' on' : '') + '" d="' + SEG[s] + '"/>').join('') +
                  [...LIT[n]].map((s) => '<path class="shine" fill="url(#nuke-shine-' + i + ')" d="' + SEG[s] + '"/>').join('') + '</g></svg>';
                const draw = (b) => { b.innerHTML = glyph(+b.dataset.d, b.dataset.i); };
                root.querySelectorAll('b').forEach((b, i) => { b.dataset.i = i; b.dataset.d = b.textContent.trim(); draw(b); });
                const target = root.dataset.target && Date.parse(root.dataset.target);
                if (target) {
                  const put = (row, v) => { const s = String(v).padStart(2, '0'), r = rows.indexOf(row);
                    row.firstElementChild.innerHTML = [...s].map((c, j) => '<b data-d="' + c + '" data-i="' + (r * 2 + j) + '"></b>').join(''); row.querySelectorAll('b').forEach(draw); };
                  const tick = () => { let t = Math.max(0, Math.floor((target - Date.now()) / 1000));
                    [86400, 3600, 60, 1].forEach((u, i) => { put(rows[i], Math.floor(t / u)); t %= u; }); };
                  tick(); setInterval(tick, 1000);
                }
                if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
                // Brady 2026-11-20: no grey dimming; the flicker ALTERNATES a digit between random numbers and its real value
                // (e.g. 7 0 3 0) in a quick burst, staying full chrome, then settles on the real value.
                const pick = () => 1 + Math.floor(Math.random() * 9);   // never 0, so every flip is visible
                // Brady 2026-11-20 "more number flickering": two independent loops, a burst every 0.8-2 s from each (flickering about 60% of the time),
                // 1-3 digits per burst, 3-5 random/real alternations
                const busy = new Set();
                const glitch = () => {
                  const all = [...root.querySelectorAll('b')].filter((b) => !busy.has(b)), n = 1 + Math.floor(Math.random() * 3);
                  const hit = all.sort(() => Math.random() - .5).slice(0, n);
                  hit.forEach((b) => busy.add(b));
                  const phases = 2 * (3 + Math.floor(Math.random() * 3));
                  let k = 0;
                  const step = () => {
                    hit.forEach((b) => { b.innerHTML = glyph(k % 2 === 0 ? pick() : +b.dataset.d, b.dataset.i); });
                    if (++k < phases) setTimeout(step, 45 + Math.random() * 35); else hit.forEach((b) => { draw(b); busy.delete(b); });
                  };
                  if (hit.length) step();
                  setTimeout(glitch, 800 + Math.random() * 1200);
                };
                setTimeout(glitch, 500); setTimeout(glitch, 1100);
              })();
            </script>
          </div>
          <!-- Real sign-up: posts to the live Shopify store's own newsletter form (deluxe-hq.com), tagged waitlist, into a hidden frame so the visitor stays here -->
          <iframe name="waitlist-sink" title="Waitlist" hidden></iframe>
          <form class="waitlist__form" data-form="waitlist" method="post" action="https://deluxe-hq.com/contact#contact_form" target="waitlist-sink" accept-charset="UTF-8" novalidate>
            <input type="hidden" name="form_type" value="customer">
            <input type="hidden" name="utf8" value="✓">
            <input type="hidden" name="contact[tags]" value="newsletter,waitlist,season-01">
            <label class="visually-hidden" for="waitlist-email">Email address</label>
            <span class="waitlist__field"><input id="waitlist-email" type="email" name="contact[email]" placeholder="Email address" autocomplete="email" required></span>
            <span class="waitlist__cta"><button type="submit">Join the waitlist</button></span>
            <p class="form-status" data-status role="status" aria-live="polite"></p>
          </form>
        </div>
      </div>
    </div>
  </section>
</main>


<script src="assets/js/site.js"></script>
</body>
</html>
