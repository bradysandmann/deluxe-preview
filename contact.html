<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
  <title>Contact | Deluxe</title>
  <meta name="description" content="Contact Deluxe. Send a message about orders, wholesale, press or anything else.">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="assets/img/favicon-64.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css">
  <link rel="stylesheet" href="assets/css/pages.css">
</head>
<body data-page="contact">
  <div data-include="header"></div>

  <main id="main">
    <div class="page-head">
      <div class="wrap">
        <h1>Contact</h1>
      </div>
    </div>

    <section class="section section--after-head">
      <div class="wrap contact-layout">
        <div class="contact-info">
          <h2 class="contact-title">Write to us about</h2>
          <ul>
            <li>Orders, once the store opens</li>
            <li>Wholesale and stocking Deluxe</li>
            <li>Press and partnerships</li>
            <li>Anything else</li>
          </ul>
          <a class="text-link" href="https://www.instagram.com/deluxe.hq/" rel="noopener">@deluxe.hq on Instagram</a>
          <p class="note">Live Deluxe LLC, Austin, Texas</p>
        </div>

        <div class="contact-form">
          <h2 class="contact-title">Send a message</h2>
          <!-- Field names match the Shopify contact form so this ports straight into the theme -->
          <form class="form" data-form="contact" novalidate>
            <label>Name (optional)
              <input type="text" name="contact[name]" autocomplete="name">
            </label>
            <label>Email (required)
              <input type="email" name="contact[email]" autocomplete="email" required>
            </label>
            <label>Phone (optional)
              <input type="tel" name="contact[phone]" autocomplete="tel">
            </label>
            <label>Message (required)
              <textarea name="contact[body]" required></textarea>
            </label>
            <button class="btn" type="submit">Send message</button>
            <p class="form-status" data-status role="status" aria-live="polite"></p>
          </form>
        </div>
      </div>
    </section>
  </main>

  <div data-include="signup"></div>
  <div data-include="footer"></div>

  <script src="assets/js/site.js"></script>
</body>
</html>
