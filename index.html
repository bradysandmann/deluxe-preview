<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Deluxe | Feel Deluxe. Live Deluxe.</title>
<meta name="description" content="Deluxe is an electrolyte drink mix with energy and vitamins in single-serve stick packs. Launching soon. Join the list for early access.">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="assets/img/favicon-64.png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
<link rel="stylesheet" href="assets/css/showroom.css">
</head>
<body data-page="gate">
<div data-include="header"></div>

<main id="main">

  <!-- Hero: silent looping real-footage film with the holographic mark over it -->
  <section class="hero" data-hero aria-label="Deluxe">
    <video class="hero__video" autoplay muted loop playsinline preload="auto" poster="assets/img/hero-film.jpg" aria-hidden="true" tabindex="-1">
      <source src="assets/video/hero-film-v.mp4" type="video/mp4" media="(max-aspect-ratio: 4/5)">
      <source src="assets/video/hero-film.mp4" type="video/mp4">
    </video>
    <div class="hero__shade"></div>
    <div class="holo" aria-hidden="true">
      <div class="holo__mark">
        <img class="holo__ghost" src="assets/img/logo-lockup-alpha.png" alt="" width="1167" height="842">
        <img class="holo__logo" src="assets/img/logo-lockup-alpha.png" alt="" width="1167" height="842">
        <div class="holo__sweep"></div>
        <div class="holo__scan"></div>
      </div>
    </div>
    <div class="wrap hero__foot">
      <div class="hero__pitch">
        <h1 class="visually-hidden">Deluxe. Feel Deluxe. Live Deluxe.</h1>
        <div class="waitlist" id="early-access">
          <!-- No launch date yet (Brady 2026-11-19): the countdown is shown "under repair" instead of ticking to a made-up date -->
          <div class="countdown countdown--repair">
            <p class="countdown__label">Season 01</p>
            <p class="countdown__digits countdown__digits--broken" aria-hidden="true"><span data-l="Days"><b>4</b><b class="tilt">2</b></span><i>:</i><span data-l="Hrs"><b class="out">0</b><b>3</b></span><i class="slip">:</i><span data-l="Min"><b>3</b><b class="tilt2">4</b></span><i>:</i><span data-l="Sec"><b>2</b><b class="out">2</b></span></p>
            <script>
              (() => {   // broken clock: digits keep scrambling, so it never reads as a real date
                if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
                const d = document.querySelectorAll('.countdown__digits--broken b');
                setInterval(() => { d.forEach((b) => { if (Math.random() < .35) b.textContent = Math.floor(Math.random() * 10); }); }, 140);
              })();
            </script>
            <div class="repair-stage">
              <svg class="repair" viewBox="-40 0 400 120" role="img" aria-label="A broken countdown clock in pieces. One builder naps, the other swears, throws his mallet at him, and the napper works for a moment before dozing off again.">
              <defs>
                <radialGradient id="g-skin" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#f6c9a6"/><stop offset=".7" stop-color="#e2a27a"/><stop offset="1" stop-color="#c27f5a"/></radialGradient>
                <radialGradient id="g-tank" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="#b8bbc1"/><stop offset="1" stop-color="#6e7177"/></radialGradient>
                <linearGradient id="g-cap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a5d63"/><stop offset="1" stop-color="#2c2e32"/></linearGradient>
                <linearGradient id="g-buckle" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#9da1a8"/></linearGradient>
                <linearGradient id="g-mallet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d7d9de"/><stop offset="1" stop-color="#7d8086"/></linearGradient>
              </defs>
              
              
              </g></g>
              
              <g class="flyer"><g transform="translate(-35 -50)"><path class="b-handle" d="M27 71 L40 56"/><rect class="b-mallet" x="31" y="40" width="22" height="15" rx="3" transform="rotate(45 42 47.5)"/></g></g>
              <g class="zzz"><text x="246" y="34">z</text><text x="256" y="24">z</text><text x="268" y="12">Z</text></g>
              <g class="say say--a" transform="translate(30 14)"><rect width="70" height="20" rx="6"/><path d="M56 18 L70 30 L64 18 Z"/><text x="35" y="14">#@$%!</text></g>
              <g class="say say--b" transform="translate(272 26)"><rect width="34" height="20" rx="6"/><path d="M6 18 L0 30 L14 18 Z"/><text x="17" y="14.5">?!</text></g>
              <g class="say say--c" transform="translate(30 14)"><rect width="70" height="20" rx="6"/><path d="M56 18 L70 30 L64 18 Z"/><text x="35" y="14">#@$%!</text></g>
              <g class="sparks" transform="translate(222 30)"><path d="M0 0 l-10 -6 M0 0 l-12 2 M0 0 l-6 -11 M0 0 l3 -12 M0 0 l9 -8"/></g>
              <path class="repair__ground" d="M-30 113 H350"/>
            </svg>
              <img class="bld bld-a bld-hammer" src="assets/img/builder-1-hammer.webp" alt="" width="230" height="320">
              <img class="bld bld-a bld-throw" src="assets/img/builder-2-throw.webp" alt="" width="310" height="320">
              <img class="bld bld-a bld-lift" src="assets/img/builder-5-lift.webp" alt="" width="324" height="320">
              <img class="bld bld-b bld-sleep" src="assets/img/builder-3-sleep.webp" alt="" width="204" height="320">
              <img class="bld bld-b bld-work" src="assets/img/builder-4-work.webp" alt="" width="232" height="320">
              <img class="bld bld-b bld-weld" src="assets/img/builder-6-weld.webp" alt="" width="284" height="320">
            </div>
            <p class="repair__note"><strong>Countdown under repair.</strong> The crew is dialing in the drop date. Join the waitlist and you hear it first.</p>
          </div>
          <!-- Real sign-up: posts to the live Shopify store's own newsletter form (deluxe-hq.com), tagged waitlist, into a hidden frame so the visitor stays here -->
          <iframe name="waitlist-sink" title="Waitlist" hidden></iframe>
          <form class="waitlist__form" data-form="waitlist" method="post" action="https://deluxe-hq.com/contact#contact_form" target="waitlist-sink" accept-charset="UTF-8" novalidate>
            <input type="hidden" name="form_type" value="customer">
            <input type="hidden" name="utf8" value="✓">
            <input type="hidden" name="contact[tags]" value="newsletter,waitlist,season-01">
            <label class="visually-hidden" for="waitlist-email">Email address</label>
            <input id="waitlist-email" type="email" name="contact[email]" placeholder="Email address" autocomplete="email" required>
            <button type="submit">Join the waitlist</button>
            <p class="form-status" data-status role="status" aria-live="polite"></p>
          </form>
        </div>
      </div>
    </div>
  </section>
</main>


<script src="assets/js/site.js"></script>
</body>
</html>
